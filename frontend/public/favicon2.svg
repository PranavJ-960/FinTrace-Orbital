<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Receipt body with torn bottom edge -->
  <path d="M18 10 H46 V50
           l-3.5 -3 -3.5 3 -3.5 -3 -3.5 3 -3.5 -3 -3.5 3 -3.5 -3 -3.5 3
           V10 Z"
        fill="#FFFFFF"/>

  <!-- Receipt text lines -->
  <rect x="23" y="17" width="18" height="2.4" rx="1.2" fill="#94A3B8"/>
  <rect x="23" y="23" width="18" height="2.4" rx="1.2" fill="#94A3B8"/>
  <rect x="23" y="29" width="12" height="2.4" rx="1.2" fill="#94A3B8"/>

  <!-- Scan line accent -->
  <rect x="16" y="34" width="32" height="3" rx="1.5" fill="#38BDF8" opacity="0.85"/>

  <!-- Checkmark badge -->
  <circle cx="46" cy="44" r="12" fill="#22C55E" stroke="#FFFFFF" stroke-width="2.5"/>
  <path d="M40.5 44 L44.5 48 L52 40" stroke="#FFFFFF" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
